[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedconformal"
version = "0.1.0"
description = "Federated conformal prediction for cross-site clinical data (workshop toolkit)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Workshop: Beyond Interoperability" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "nbformat>=5.7"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
